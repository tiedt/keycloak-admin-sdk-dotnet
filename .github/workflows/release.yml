name: Release NuGet preview

on:
  push:
    tags: ['v*-*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet restore Keycloak.AdminSdk.sln
      - run: dotnet build Keycloak.AdminSdk.sln --configuration Release --no-restore --no-incremental
      - run: dotnet test Keycloak.AdminSdk.sln --configuration Release --no-build
      - name: Pack
        run: |
          dotnet pack src/Keycloak.AdminSdk/Keycloak.AdminSdk.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }}
          dotnet pack src/Keycloak.AdminSdk.Diagnostics.Mcp/Keycloak.AdminSdk.Diagnostics.Mcp.csproj --configuration Release --no-build --output artifacts -p:PackageVersion=${{ steps.version.outputs.value }}
      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX Keycloak.AdminSdk.sln --output artifacts/sbom
      - name: Authenticate to NuGet with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tiedt
      - name: Publish NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/sbom/**
